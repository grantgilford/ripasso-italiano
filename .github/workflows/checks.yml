# The automatic checks: on every pull request, and on every push to main (a merge), GitHub runs the
# content check and the three browser tests on index.html. A red cross on the pull request means one of
# them failed; open the run to see which step and why. The speed test (tools/test-perf.js) is left out,
# because the shared computers GitHub runs this on vary in speed; run it with npm test instead.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: # a new push to the same branch replaces a run still going
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Content and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright with Chromium
        id: setup
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Each check runs even when an earlier one failed, so one run shows every problem; the job fails if any does.
      - name: Content check (tools/check-content.js)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node tools/check-content.js

      - name: Progress safety test (tools/test-progress.js)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node tools/test-progress.js

      - name: Interface test (tools/test-ui.js)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node tools/test-ui.js

      - name: Installed-copy test (tools/test-install.js)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node tools/test-install.js
