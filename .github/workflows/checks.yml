# The automatic checks: on every pull request, and on every push to main (a merge), GitHub runs the content check and
# every test on index.html, each as its own job, side by side, so each has its own tick or cross and the whole run takes
# as long as the slowest (about five minutes) rather than their sum. A red cross on the pull request means that suite
# failed: open the job to see which check and why; its whole output is also attached to the run (test-output).
#
# Each job runs its suite through the runner (tools/run-tests.js), which also fails a suite that passes with fewer checks
# than tools/check-counts.json records. The speed job times main's index.html and this one on the same computer and
# fails when a figure is over 40% slower (the fixed budgets in tools/test-perf.js are for npm test on your own computer).
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: # a new push to the same branch replaces a run still going
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: ${{ matrix.title }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # every suite runs to its end, so one run shows every problem
      matrix:
        include:
          # browsers: what Playwright must install for the suite ("" for the suites that run in Node alone)
          - { suite: check-content, title: "Content check", browsers: "" }
          - { suite: test-reports, title: "Reports", browsers: "" }
          - { suite: test-course, title: "Course sweep (every exercise, no browser)", browsers: "" }
          - { suite: test-rules, title: "Learning rules", browsers: "chromium" }
          - { suite: test-storage, title: "Storage", browsers: "chromium", args: "--require-old" }
          - { suite: test-progress, title: "Progress safety", browsers: "chromium" }
          - { suite: test-ui, title: "Interface", browsers: "chromium" }
          - { suite: test-install, title: "Installed copy", browsers: "chromium" }
          - { suite: test-speedups, title: "Speed-ups", browsers: "chromium" }
          - { suite: test-sessions, title: "Sessions", browsers: "chromium" }
          - { suite: test-choices, title: "Choices", browsers: "chromium" }
          - { suite: test-items, title: "Items (a sample of the course, through the screen)", browsers: "chromium" }
          - { suite: test-verbs, title: "Verbs (through the screen)", browsers: "chromium" }
          - { suite: test-browsers, title: "Other browsers (Firefox, WebKit)", browsers: "firefox webkit", args: "--require" }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright (${{ matrix.browsers }})
        if: ${{ matrix.browsers != '' }}
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browsers }}

      # The storage test updates from, and goes back to, the version before the move to IndexedDB: its index.html comes
      # from the tag v9.25, which a shallow checkout doesn't have. With --require-old the test fails without it.
      - name: Fetch the tag v9.25
        if: ${{ matrix.suite == 'test-storage' }}
        run: git fetch --depth 1 origin tag v9.25

      - name: ${{ matrix.title }} (tools/${{ matrix.suite }}.js)
        run: node tools/run-tests.js ${{ matrix.suite }} --verbose -- ${{ matrix.args }}

      - name: Keep the suite's output
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ matrix.suite }}
          path: test-output/
          retention-days: 14

  speed:
    name: Speed (against main, on the same computer)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright with Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # The index.html to compare with: the pull request's base, or on main the commit before the push.
      - name: Fetch the index.html before this change
        run: |
          git fetch --depth 1 origin ${{ github.event.pull_request.base.sha || github.event.before }}
          git show FETCH_HEAD:index.html > "$RUNNER_TEMP/before.html"

      - name: Speed test (tools/test-perf.js --against)
        run: |
          mkdir -p test-output
          node tools/test-perf.js --against "$RUNNER_TEMP/before.html" 2>&1 | tee test-output/test-perf.log

      - name: Keep the output
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: output-test-perf
          path: test-output/
          retention-days: 14
