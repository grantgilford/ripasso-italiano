<!doctype html>
<html lang="en">
<head>
<!-- Static copy of a Ripasso design mockup (October 2026). Reference only: the app itself is index.html. -->
<meta charset="utf-8">
<title>Piazza units</title>
</head>
<body>
<style>
@font-face{font-family:'Bricolage Grotesque';src:url(../fonts/bricolage-grotesque-500-700.woff2) format('woff2');font-weight:500 700;font-style:normal}
@font-face{font-family:'DM Sans';src:url(../fonts/dm-sans-400-700.woff2) format('woff2');font-weight:400 700;font-style:normal}
@font-face{font-family:'DM Sans';src:url(../fonts/dm-sans-italic-400-500.woff2) format('woff2');font-weight:400 500;font-style:italic}
html{background:#888}body{display:flex;justify-content:center;padding:24px 0}
</style>
<style>
body{margin:0}
a{color:#0F6B4B}a:hover{color:#0A4F37}
button{font:inherit}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6F4; color: #10201A; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column">
  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 30px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: flex-end">
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px">Units</h1>
        <span style="font-size: 14px; color: #55655D"><span style="font-weight: 600; color: #10201A">41%</span> of the course learned</span>
      </div>
      <div style="height: 6px; background: #D9E3DE; border-radius: 999px"><div style="width: 41%; height: 6px; background: #0F6B4B; border-radius: 999px"></div></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #E4EBE7; border-radius: 14px; padding: 4px">
      <button aria-pressed="true" style="all: unset; cursor: pointer; height: 44px; border-radius: 11px; background: #FFFFFF; color: #0F6B4B; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px">Grammar <span style="font-size: 13px; color: #55655D; font-weight: 500">17</span></button>
      <button aria-pressed="false" style="all: unset; cursor: pointer; height: 44px; border-radius: 11px; color: #55655D; font-weight: 500; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px">Vocab <span style="font-size: 13px">4</span></button>
      <button aria-pressed="false" style="all: unset; cursor: pointer; height: 44px; border-radius: 11px; color: #55655D; font-weight: 500; font-size: 15px; display: flex; align-items: center; justify-content: center">Verbs</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <button style="all: unset; cursor: pointer; background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
        <span style="flex: none; width: 42px; height: 42px; border-radius: 12px; background: #0F6B4B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px">1</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
          <span style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
            <span style="font-weight: 600; font-size: 16px">Essere &amp; pronouns</span>
            <span style="display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: #0F6B4B"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>Learned</span>
          </span>
          <span style="font-size: 13px; color: #55655D">To be, subject pronouns</span>
        </span>
      </button>
      <button style="all: unset; cursor: pointer; background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
        <span style="flex: none; width: 42px; height: 42px; border-radius: 12px; background: #E1EFE8; color: #0F6B4B; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px">2</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
          <span style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
            <span style="font-weight: 600; font-size: 16px">Nouns &amp; articles</span>
            <span style="font-size: 13px; font-weight: 600; color: #55655D">92%</span>
          </span>
          <span style="font-size: 13px; color: #55655D">Gender, plurals, il · lo · la</span>
          <span style="height: 4px; background: #D9E3DE; border-radius: 999px"><span style="display: block; width: 92%; height: 4px; background: #0F6B4B; border-radius: 999px"></span></span>
        </span>
      </button>
      <button style="all: unset; cursor: pointer; background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
        <span style="flex: none; width: 42px; height: 42px; border-radius: 12px; background: #E1EFE8; color: #0F6B4B; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px">3</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
          <span style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
            <span style="font-weight: 600; font-size: 16px">-are verbs</span>
            <span style="font-size: 13px; font-weight: 600; color: #55655D">85%</span>
          </span>
          <span style="font-size: 13px; color: #55655D">Regular present tense</span>
          <span style="height: 4px; background: #D9E3DE; border-radius: 999px"><span style="display: block; width: 85%; height: 4px; background: #0F6B4B; border-radius: 999px"></span></span>
        </span>
      </button>
      <button style="all: unset; cursor: pointer; background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
        <span style="flex: none; width: 42px; height: 42px; border-radius: 12px; background: #E1EFE8; color: #0F6B4B; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px">4</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
          <span style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
            <span style="font-weight: 600; font-size: 16px">Irregular verbs</span>
            <span style="font-size: 13px; font-weight: 600; color: #55655D">71%</span>
          </span>
          <span style="font-size: 13px; color: #55655D">Present: andare, fare, avere…</span>
          <span style="height: 4px; background: #D9E3DE; border-radius: 999px"><span style="display: block; width: 71%; height: 4px; background: #0F6B4B; border-radius: 999px"></span></span>
        </span>
      </button>
      <div style="background: #FFFFFF; border: 2px solid #0F6B4B; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: center; gap: 14px; padding-left: 2px">
          <span style="flex: none; width: 42px; height: 42px; border-radius: 12px; background: #E1EFE8; color: #0F6B4B; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px">5</span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
              <span style="font-weight: 600; font-size: 16px">Verb tenses</span>
              <span style="font-size: 13px; font-weight: 600; color: #0F6B4B">64%</span>
            </div>
            <span style="font-size: 13px; color: #55655D">Current unit · 5 new · 7 to review</span>
            <div style="height: 4px; background: #D9E3DE; border-radius: 999px"><div style="width: 64%; height: 4px; background: #0F6B4B; border-radius: 999px"></div></div>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <button style="all: unset; cursor: pointer; height: 46px; border-radius: 14px; background: #0F6B4B; color: #FFFFFF; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center">Practise</button>
          <a href="lesson-light.html" style="text-decoration: none; height: 46px; border-radius: 14px; background: #E1EFE8; color: #0F6B4B; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></svg>Read lesson</a>
        </div>
      </div>
      <button style="all: unset; cursor: pointer; background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
        <span style="flex: none; width: 42px; height: 42px; border-radius: 12px; background: #E1EFE8; color: #0F6B4B; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px">6</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
          <span style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
            <span style="font-weight: 600; font-size: 16px">Adjectives</span>
            <span style="font-size: 13px; font-weight: 600; color: #55655D">38%</span>
          </span>
          <span style="font-size: 13px; color: #55655D">Agreement and position</span>
          <span style="height: 4px; background: #D9E3DE; border-radius: 999px"><span style="display: block; width: 38%; height: 4px; background: #0F6B4B; border-radius: 999px"></span></span>
        </span>
      </button>
      <button style="all: unset; cursor: pointer; background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
        <span style="flex: none; width: 42px; height: 42px; border-radius: 12px; background: #E4EBE7; color: #55655D; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px">7</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
          <span style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
            <span style="font-weight: 600; font-size: 16px">Numbers</span>
            <span style="font-size: 13px; color: #55655D">Not started</span>
          </span>
          <span style="font-size: 13px; color: #55655D">Counting, ordinals, prices</span>
        </span>
      </button>
    </div>
  </div>
  <nav style="display: flex; justify-content: space-around; background: #FFFFFF; padding: 8px 8px 20px; border-top: 1px solid #E1E8E4">
    <a href="home-light.html" style="text-decoration: none; color: #55655D; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 8px; font-size: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"></path></svg>Today</a>
    <a href="#" aria-current="page" style="text-decoration: none; color: #0F6B4B; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 8px; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>Units</a>
    <a href="#" style="text-decoration: none; color: #55655D; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 8px; font-size: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></svg>Rules</a>
    <a href="#" style="text-decoration: none; color: #55655D; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 8px; font-size: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>Look up</a>
    <a href="you-light.html" style="text-decoration: none; color: #55655D; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 8px; font-size: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path></svg>You</a>
  </nav>
</div>
</body>
</html>
