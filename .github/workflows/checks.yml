# The automatic checks: on every pull request, and on every push to main (a merge), GitHub runs the
# content check and the browser tests on index.html. A red cross on the pull request means one of
# them failed; open the run to see which step and why. The speed test (tools/test-perf.js) is left out,
# because the shared computers GitHub runs this on vary in speed; run it with npm test instead.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: # a new push to the same branch replaces a run still going
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Content and browser tests
    # Pinned: in November 2026 ubuntu-latest moved to Ubuntu 26.04, where the pinned Playwright (1.56.1) cannot install
    # Chromium. Move this on when package.json moves to a Playwright that supports the newer image.
    runs-on: ubuntu-24.04
    timeout-minutes: 40 # a run takes about 23 minutes (the Verbs test over half of it)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright with Chromium
        id: setup
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Each check runs even when an earlier one failed, so one run shows every problem; the job fails if any does.
      - name: Content check (tools/check-content.js)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node tools/check-content.js

      - name: Reports test (tools/test-reports.js)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node tools/test-reports.js

      # The storage test updates from, and goes back to, the version before the move to IndexedDB: its index.html comes
      # from the tag v9.25, which a shallow checkout doesn't have (without it that section is skipped with a note).
      - name: Storage test (tools/test-storage.js)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          git fetch --depth 1 origin tag v9.25 || echo "could not fetch the tag v9.25"
          node tools/test-storage.js

      - name: Progress safety test (tools/test-progress.js)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node tools/test-progress.js

      - name: Interface test (tools/test-ui.js)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node tools/test-ui.js

      - name: Installed-copy test (tools/test-install.js)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node tools/test-install.js

      - name: Speed-ups test (tools/test-speedups.js)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node tools/test-speedups.js

      - name: Session test (tools/test-sessions.js)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node tools/test-sessions.js

      - name: Choices test (tools/test-choices.js)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node tools/test-choices.js

      - name: Verbs test (tools/test-verbs.js)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node tools/test-verbs.js
