<!doctype html>
<html lang="en">
<head>
<!-- Static copy of a Ripasso design mockup (October 2026). Reference only: the app itself is index.html. -->
<meta charset="utf-8">
<title>Ripasso home v2</title>
</head>
<body>
<style>
@font-face{font-family:'Bricolage Grotesque';src:url(../fonts/bricolage-grotesque-500-700.woff2) format('woff2');font-weight:500 700;font-style:normal}
@font-face{font-family:'DM Sans';src:url(../fonts/dm-sans-400-700.woff2) format('woff2');font-weight:400 700;font-style:normal}
@font-face{font-family:'DM Sans';src:url(../fonts/dm-sans-italic-400-500.woff2) format('woff2');font-weight:400 500;font-style:italic}
html{background:#888}body{display:flex;justify-content:center;padding:24px 0}
</style>
<style>
body{margin:0}
a{color:#0F6B4B}a:hover{color:#0A4F37}
button{font:inherit}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6F4; color: #10201A; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column">
  <div style="flex: 1; min-height: 0; padding: 30px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; align-items: center; gap: 10px"><svg width="32" height="32" viewBox="0 0 100 100" aria-hidden="true" style="flex: none; display: block"><rect width="100" height="100" rx="23" fill="#0F6B4B"></rect><path d="M31 32 L45 68" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" fill="none"></path><path d="M55 32 L69 68" stroke="#EF4B55" stroke-width="13" stroke-linecap="round" fill="none"></path></svg><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; letter-spacing: -0.5px; line-height: 1; font-size: 24px">ripasso</span></div>
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="display: flex; align-items: center; gap: 6px; background: #FFFFFF; border-radius: 999px; padding: 8px 12px; font-weight: 600; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C62B36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-6 1 1 2 2 3 2 0-2-1-4 0-6z"></path></svg>12</div>
        <div style="position: relative; width: 52px; height: 52px">
          <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="22" fill="none" stroke="#D9E3DE" stroke-width="5"></circle><circle cx="26" cy="26" r="22" fill="none" stroke="#0F6B4B" stroke-width="5" stroke-linecap="round" stroke-dasharray="83 138" transform="rotate(-90 26 26)"></circle></svg>
          <span style="position: absolute; top: 0; left: 0; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">18/30</span>
        </div>
      </div>
    </div>
    <button style="all: unset; cursor: pointer; background: #0F6B4B; color: #FFFFFF; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
      <span style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.16); border-radius: 999px; padding: 5px 10px">Unit 5</span>
        <span style="font-size: 13px; opacity: 0.9">64% learned</span>
      </span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.1">Verb tenses</span>
      <span style="height: 6px; background: rgba(255,255,255,0.22); border-radius: 999px"><span style="display: block; width: 64%; height: 6px; background: #FFFFFF; border-radius: 999px"></span></span>
      <span style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 14px; opacity: 0.9">5 new · 7 to review</span>
        <span style="background: #FFFFFF; color: #0F6B4B; font-weight: 700; border-radius: 999px; padding: 10px 18px">Continue</span>
      </span>
    </button>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button style="all: unset; cursor: pointer; background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F6B4B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg><span style="font-weight: 600; font-size: 16px">Review</span><span style="font-size: 13px; color: #55655D">23 due</span></button>
      <button style="all: unset; cursor: pointer; background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F6B4B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h13"></path></svg><span style="font-weight: 600; font-size: 16px">Verbs</span><span style="font-size: 13px; color: #55655D">8 due · 5 new</span></button>
      <button style="all: unset; cursor: pointer; background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F6B4B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="14" height="14" rx="2"></rect><path d="M7 3h12a2 2 0 0 1 2 2v12"></path></svg><span style="font-weight: 600; font-size: 16px">Flashcards</span><span style="font-size: 13px; color: #55655D">40 due</span></button>
      <button style="all: unset; cursor: pointer; background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C62B36" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg><span style="font-weight: 600; font-size: 16px">Mistakes</span><span style="font-size: 13px; color: #55655D">6 to fix</span></button>
    </div>
    <button style="all: unset; cursor: pointer; background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; justify-content: space-between; align-items: center">
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 16px">Wild card</span><span style="font-size: 13px; color: #55655D">A random mix from every grammar unit</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10201A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
    <div style="background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <span style="display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F6B4B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"></path></svg><span style="font-size: 13px; font-weight: 600; color: #0F6B4B">Lo sapevi?</span><span style="font-size: 13px; color: #55655D">Did you know?</span></span>
      <p style="margin: 0; font-size: 15px; line-height: 1.45"><b>Uffa!</b> is what Italians say when they're fed up or impatient, a bit like a sighed "Ugh, come on!"</p>
    </div>
  </div>
  <nav style="display: flex; justify-content: space-around; background: #FFFFFF; padding: 8px 8px 20px; border-top: 1px solid #E1E8E4">
    <a href="home-light.html" aria-current="page" style="text-decoration: none; color: #0F6B4B; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 8px; font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"></path></svg>Today</a>
    <a href="units-light.html" style="text-decoration: none; color: #55655D; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 8px; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>Units</a>
    <a href="#" style="text-decoration: none; color: #55655D; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 8px; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></svg>Rules</a>
    <a href="#" style="text-decoration: none; color: #55655D; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 8px; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>Look up</a>
    <a href="you-light.html" style="text-decoration: none; color: #55655D; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 8px; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path></svg>You</a>
  </nav>
</div>
</body>
</html>
